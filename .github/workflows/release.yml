# Versioned releases, driven by Conventional Commits.
#
# Every push to main runs release-please, which keeps one open "chore: release
# x.y.z" PR up to date: the next version worked out from the commit types since
# the last release (fix -> patch, feat -> minor, a ! or BREAKING CHANGE ->
# major), CHANGELOG.md, and the version in pubspec.yaml. Merging that PR is the
# release: the next run tags it, opens a draft GitHub release with the
# changelog, builds the APKs and the Windows app from the tagged commit,
# attaches them with checksums and provenance, and only then publishes it, so
# nobody ever sees a release without its files. See docs/RELEASING.md.
name: Release

on:
  push:
    branches: [main]

# Never two at once, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Optional. A release PR opened with the default token does not
          # trigger CI on itself (GitHub's guard against workflow loops); a
          # fine-grained PAT here lets its checks run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      mode: release
      version: ${{ needs.release-please.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      SHA: ${{ needs.release-please.outputs.sha }}
      SIGNED: ${{ needs.build.outputs.android-signed == 'true' }}
      FLUTTER_VERSION: ${{ needs.build.outputs.flutter-version }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SLSA build provenance for every file: `gh attestation verify` can
      # prove it came out of this workflow at this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach the files
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"

      - name: Publish
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body \
            | tool/ci/release_notes.sh > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$REPO" \
            --title "Chalk $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --draft=false \
            --latest
