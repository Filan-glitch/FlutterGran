# Builds the Android APKs and the Windows app. Not triggered on its own:
# ci.yml calls it in debug for every PR, release.yml in release for every
# version release-please cuts. One definition, so what CI proves builds is
# exactly what gets released.
name: Build

on:
  workflow_call:
    inputs:
      mode:
        description: debug or release
        type: string
        required: true
      version:
        description: >-
          The version being released, without the v (release mode only).
          Checked against pubspec.yaml, which is what the build actually
          stamps into the APK and the .exe.
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      android-signed:
        description: Whether the APKs carry the release key rather than a debug key
        value: ${{ jobs.android.outputs.signed }}
      flutter-version:
        description: The Flutter framework version that built the apps
        value: ${{ jobs.android.outputs.flutter }}

permissions:
  contents: read

env:
  # Pinned, so a release is reproducible from its tag. Bump deliberately,
  # together with .metadata, when the project moves to a new Flutter.
  FLUTTER_VERSION: 3.47.8
  MODE: ${{ inputs.mode }}
  VERSION: ${{ inputs.version }}
  # Asset names: chalk-<version>-<platform>[-<variant>].<ext>
  NAME: chalk-${{ inputs.version != '' && inputs.version || 'dev' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      flutter: ${{ steps.flutter.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        id: flutter
        run: echo "version=$(flutter --version --machine | jq -r .frameworkVersion)" >> "$GITHUB_OUTPUT"

      - name: Version matches pubspec.yaml
        if: inputs.mode == 'release'
        run: tool/ci/check_version.sh "$VERSION"

      - run: flutter pub get

      # The keystore never touches the repository: it is decoded from a
      # secret into the runner's temp dir and gone with the runner.
      - name: Release signing
        id: signing
        if: inputs.mode == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Unsigned release::ANDROID_KEYSTORE_BASE64 is not set, so these APKs are signed with this runner's throwaway debug key and cannot update an earlier install. See docs/RELEASING.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir -p dist
          if [ "$MODE" = release ]; then
            # One APK per ABI, small enough to sideload on a slow
            # connection, plus a universal one for anyone who does not know
            # which ABI their device is.
            flutter build apk --release --split-per-abi
            for abi in arm64-v8a armeabi-v7a x86_64; do
              cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/$NAME-android-$abi.apk"
            done
            flutter build apk --release
            cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME-android.apk"
          else
            flutter build apk --debug
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/$NAME-android-debug.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.mode }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.mode == 'release' && 30 || 7 }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version matches pubspec.yaml
        if: inputs.mode == 'release'
        run: tool/ci/check_version.sh "$VERSION"

      - run: flutter pub get

      - name: Build
        run: flutter build windows --"$MODE"

      # A Flutter .exe needs the Visual C++ runtime, which a fresh Windows
      # install does not always have. Shipping the three DLLs beside it is
      # what Flutter's own docs recommend over asking people to install the
      # redistributable. Then zip the folder: it is the app, not just the .exe.
      - name: Package
        shell: pwsh
        run: |
          $mode = if ($env:MODE -eq 'release') { 'Release' } else { 'Debug' }
          $app = "build\windows\x64\runner\$mode"
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $app
          }
          $suffix = if ($env:MODE -eq 'release') { '' } else { '-debug' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$app\*" -DestinationPath "dist\$env:NAME-windows-x64$suffix.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ inputs.mode }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.mode == 'release' && 30 || 7 }}
