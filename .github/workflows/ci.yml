name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as build.yml.
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get

      # lib/data/db/database.g.dart is committed; fail if it is stale.
      - name: Generated drift code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'

      - run: flutter analyze

      # Pure-Dart layers, no Flutter (also enforces the domain layering rule).
      - name: Test domain and data
        run: dart test test/domain test/data

      - name: Test everything
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # A debug APK and a debug Windows build, from the same workflow the
  # releases use. The Windows half is the only place the C++ runner and the
  # plugins' native Windows code get compiled before a release.
  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      mode: debug
