# Lint and analysis configuration for fluttergran.
#
# The base set is flutter_lints. On top of that this project enables strict
# type checking, because the domain layer (lib/domain) is pure Dart modelling
# scoring rules, where a silently-inferred `dynamic` would hide a real bug.
#
# Rules can be suppressed per line with `// ignore: name_of_lint` or per file
# with `// ignore_for_file: name_of_lint`.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated drift code triggers this; it is not actionable.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cast_nullable_to_non_nullable
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - unnecessary_parenthesis
    - use_enums
