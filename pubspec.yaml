name: fluttergran
description: "Flutter Mobile Application for interacting with a GranBoard 132 Electronic Dartboard"
publish_to: 'none'

# Owned by release-please - never edit by hand (docs/RELEASING.md).
version: 1.3.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # The AppLocalizations delegates for lib/l10n/*.arb.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_blue_plus: ^2.3.14
  path_provider: ^2.1.6
  # MIT. Two players are kept open at once - see lib/app/audio/sound_player.dart
  # - because the cues need PlayerMode.lowLatency and the commentary does not.
  audioplayers: ^6.8.1
  # BSD-3, from flutter/packages. Holds the two sound toggles. The drift
  # database is the history of every dart thrown; a preference is neither
  # history nor relational, and a table for two booleans would cost a schema
  # migration - see the note on soundEnabledProvider in lib/app/providers.dart.
  shared_preferences: ^2.5.6
  # The update check - see lib/data/update/. BSD-3, from dart-lang: http asks
  # GitHub for the latest release and streams the APK down, crypto checks the
  # download against the release's SHA256SUMS.txt before anything installs it.
  http: ^1.6.0
  crypto: ^3.0.8
  # BSD-3, fluttercommunity. The running version to compare a release against,
  # read from the APK's versionName or the .exe's version resource - both
  # stamped from pubspec.yaml at build time.
  package_info_plus: ^10.2.2
  # BSD-3, from flutter/packages. Windows has no installer to hand an update
  # to, so it opens the release page in the browser instead.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # No riverpod_generator or riverpod_lint: both conflict with drift_dev's
  # analyzer pin or with Riverpod 3 (CONTRIBUTING.md, "Dependency rules").
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  test: ^1.31.1
  audioplayers_platform_interface: ^7.2.0

flutter:
  uses-material-design: true

  # Runs gen-l10n (config in l10n.yaml) before every run/test/build. The
  # generated lib/l10n/app_localizations*.dart files are committed; CI fails
  # if they are stale.
  generate: true

  # Every line the app can speak, rendered once at build time by
  # tool/make_speech.py, plus the four synthesised cues from tool/make_cues.py.
  # The vocabulary of a darts commentator is closed - the totals 0 to 180 and
  # five fixed calls - so there is nothing for a text-to-speech engine on the
  # phone to do that has not already been done here.
  #
  # The voice model itself is build-time only and is never shipped. Its licence
  # and attribution are in assets/sounds/SPEECH-VOICE-LICENCE.txt, beside the
  # audio it produced.
  assets:
    - assets/sounds/cues/
    - assets/sounds/speech/

  # Ubuntu Sans is a variable font: one file carries both a width and a weight
  # axis, so the condensed heavy numerals on the scoreboard and the normal-width
  # body text come from the same family. The mono is for figures that must not
  # shift width as their digits change.
  # Licensed under the Ubuntu Font Licence 1.0; see the licence beside the files.
  fonts:
    - family: UbuntuSans
      fonts:
        - asset: assets/fonts/UbuntuSans.ttf
    - family: UbuntuSansMono
      fonts:
        - asset: assets/fonts/UbuntuSansMono.ttf
